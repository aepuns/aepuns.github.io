<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>secret-word admin - aepuns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@1,400;1,700&display=swap">
<style>
:root{color-scheme:dark;--bg:#101116;--panel:#1b1d26;--line:#343746;--text:#f5f6fa;--muted:#aeb2c3;--accent:#9b8cff;--good:#7be0a0;--bad:#ff8989}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}main{max-width:1100px;margin:0 auto;padding:28px 18px 60px}h1{margin:0 0 4px;font-size:clamp(1.7rem,4vw,2.5rem)}h2{margin:0 0 14px;font-size:1.2rem}.muted{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}label{color:var(--muted);font-size:.9rem}input,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px;background:#11131a;color:var(--text);font:inherit}button{border:0;border-radius:9px;padding:10px 14px;font:inherit;font-weight:650;cursor:pointer;background:var(--accent);color:#151322}button.secondary{background:#343746;color:var(--text)}button.danger{background:#6d303b;color:#fff}button:disabled{opacity:.5;cursor:wait}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.status{min-height:1.5em;margin-top:10px}.status.error{color:var(--bad)}.status.ok{color:var(--good)}.secret{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}.secret-head{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}.pill{display:inline-block;border-radius:999px;padding:3px 9px;background:#343746;color:var(--muted);font-size:.8rem}.pill.live{background:#1d5236;color:#a9f2c2}.meta{color:var(--muted);font-size:.9rem}.secret form{margin-top:12px}.secret-fields{display:grid;grid-template-columns:2fr 2fr 1fr 1fr;gap:8px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:580px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:.85rem}.hidden{display:none!important}@media(max-width:680px){.grid,.secret-fields{grid-template-columns:1fr}.secret-head{flex-direction:column}.panel{padding:14px}}

/* aepuns.ca-inspired light styling */

:root{color-scheme:light;--bg:#aeaeae;--panel:#fff;--line:#141414;--text:#101010;--muted:#303030;--accent:#111;--good:#146329;--bad:#a12020}
html{min-height:100%}body{min-height:100vh;background:#aeaeae;color:#111;font-family:"Roboto",Arial,Helvetica,sans-serif;font-style:italic;font-weight:700;text-transform:lowercase}
main{max-width:1000px;padding:28px 20px 65px}header{text-align:center;margin-bottom:18px}header p:first-child{font-size:.8rem}
h1{font-weight:700;font-size:clamp(2rem,5vw,3rem)}h2{font-weight:700;font-size:1.5rem}
.panel{background:#fff;border:2px solid #111;border-radius:6px;padding:20px;margin-top:16px;box-shadow:none}
.muted,.meta,label,th{color:#222}a{color:#111;text-decoration:underline}
input:not([type=checkbox]),textarea{font-weight:700;background:#fff;color:#111;border:2px solid #222;border-radius:5px;font:inherit;padding:10px;min-height:42px;text-transform:none}
input::placeholder{color:#666}input[type=checkbox]{accent-color:#111}
button,button.secondary,button.danger{background:#111;color:#fff;border:1px solid #111;border-radius:5px;font:700 italic 15px "Roboto",Arial,Helvetica,sans-serif;text-transform:lowercase;padding:11px 16px}
button.secondary{background:#fff;color:#111}button.danger{background:#fff;color:#9a1717;border-color:#9a1717}button:hover:not(:disabled){filter:brightness(.87)}
.secret{border:1px solid #222;border-radius:5px}.pill,.pill.live{background:#eee;color:#111;border:1px solid #222;border-radius:5px}
th,td{border-color:#bbb}.status.ok{color:#146329}.status.error{color:#a12020}
/* aepuns typography */
body,button,input,textarea,select,label,h1,h2,h3,p,table,th,td{font-family:"Roboto",Arial,Helvetica,sans-serif;font-style:italic;font-weight:700}
/* centered login */
body:has(#loginPanel:not(.hidden)){display:grid;place-items:center}
body:has(#loginPanel:not(.hidden)) main{width:100%;max-width:600px;padding:24px}
body:has(#loginPanel:not(.hidden)) header{display:none}
#loginPanel{padding:24px 28px 28px;margin:0}
#loginPanel h2{font-size:clamp(1.6rem,5vw,2rem);margin:0 0 20px}
#loginPanel p{margin:0 0 22px;font-size:.94rem}
#loginPanel label{font-weight:700;margin-bottom:4px}
#loginPanel .actions{margin-top:18px}
#loginPanel button{width:100%}
#loginPanel .status:empty{display:none}
@media(max-width:680px){#loginPanel{padding:20px}.panel{padding:15px}}
</style>
</head>
<body><main>

<section class="panel" id="loginPanel"><h2>secret-word admin</h2><form id="loginForm"><div class="field"><label for="password">Admin password</label><input id="password" type="password" autocomplete="current-password" required maxlength="1024"></div><div class="actions"><button id="loginButton">sign in</button></div></form><div id="loginStatus" class="status" role="status"></div></section>
<div id="app" class="hidden">
<section class="panel"><h2>Create a secret</h2><form id="createForm"><div class="grid"><div class="field"><label for="word">Secret word</label><input id="word" required maxlength="100" autocomplete="off"></div><div class="field"><label for="title">Stream title</label><input id="title" required maxlength="200"></div><div class="field full"><label for="url">Stream URL</label><input id="url" type="url" placeholder="https://..." maxlength="2048"></div><div class="field"><label for="livePoints">Live points</label><input id="livePoints" type="number" min="0" max="100000" step="1" value="10" required></div><div class="field"><label for="vodPoints">VOD points</label><input id="vodPoints" type="number" min="0" max="100000" step="1" value="5" required></div></div><div class="field" style="margin-top:12px"><label><input id="startLive" type="checkbox" checked style="width:auto"> Start Live</label></div><div class="actions"><button id="createButton">Create secret</button><button type="button" class="secondary" id="refreshButton">Refresh data</button><button type="button" class="secondary" id="logoutButton">Admin logout</button></div></form><div id="createStatus" class="status" role="status"></div></section>
<section class="panel"><h2>Secrets</h2><div id="secretsList"></div></section>
<section class="panel"><h2>Leaderboard</h2><div class="table-wrap" id="leaderboard"></div></section>
<section class="panel"><h2>Recent redemptions</h2><div class="table-wrap" id="redemptions"></div></section>
</div><div id="globalStatus" class="status" role="status"></div>
</main>
<script>
const API='https://aepuns-secrets-api.sheav06.workers.dev';
const $=id=>document.getElementById(id);
async function api(path,options={}){const r=await fetch(API+path,{credentials:'include',...options,headers:{...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});let data={};try{data=await r.json()}catch{}if(!r.ok)throw new Error(data.error||`Request failed (${r.status})`);return data}
function status(id,msg,error=false){const e=$(id);e.textContent=msg;e.className='status '+(error?'error':'ok')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(v){return Number(v)||0}
async function checkSession(){try{const d=await api('/admin/me');if(d.authenticated){$('loginPanel').classList.add('hidden');$('app').classList.remove('hidden');await refresh()}else{$('loginPanel').classList.remove('hidden');$('app').classList.add('hidden')}}catch{$('loginPanel').classList.remove('hidden')}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginButton').disabled=true;status('loginStatus','Checking sign-in…');try{await api('/admin/login',{method:'POST',body:JSON.stringify({password:$('password').value})});$('password').value='';status('loginStatus','Signed in.');await checkSession()}catch(err){status('loginStatus',err.message,true)}finally{$('loginButton').disabled=false}});
$('createForm').addEventListener('submit',async e=>{e.preventDefault();$('createButton').disabled=true;status('createStatus','Creating secret…');try{const d=await api('/admin/secrets',{method:'POST',body:JSON.stringify({word:$('word').value,stream_title:$('title').value,stream_url:$('url').value,live_points:num($('livePoints').value),vod_points:num($('vodPoints').value),live_enabled:$('startLive').checked})});status('createStatus',`Created secret #${d.id}. Copy this word now: ${d.word}`);$('word').value='';await refresh()}catch(err){status('createStatus',err.message,true)}finally{$('createButton').disabled=false}});
$('refreshButton').addEventListener('click',()=>refresh().catch(e=>status('globalStatus',e.message,true)));
$('logoutButton').addEventListener('click',async()=>{try{await api('/admin/logout',{method:'POST',body:'{}'});$('app').classList.add('hidden');$('loginPanel').classList.remove('hidden');status('loginStatus','Signed out.')}catch(e){status('globalStatus',e.message,true)}});
async function action(id,payload){await api('/admin/secrets/'+id,{method:'POST',body:JSON.stringify(payload)});await refresh()}
async function refresh(){const [sd,ld,rd]=await Promise.all([api('/admin/secrets'),api('/admin/leaderboard'),api('/admin/redemptions')]);$('secretsList').innerHTML=(sd.secrets||[]).length?(sd.secrets||[]).map(s=>`<article class="secret"><div class="secret-head"><div><strong>${esc(s.stream_title)}</strong><div class="meta">Secret #${s.id} · ${num(s.redemption_count)} redemption(s) · <a href="${esc(s.stream_url)}" target="_blank" rel="noopener">Stream link</a></div></div><span class="pill ${s.live_enabled?'live':''}">${s.live_enabled?'LIVE · Live points':'NOT LIVE · VOD points'}</span></div><form data-edit="${s.id}"><div class="secret-fields"><div class="field"><label>Stream title</label><input name="stream_title" required maxlength="200" value="${esc(s.stream_title)}"></div><div class="field"><label>Stream URL</label><input name="stream_url" type="url" maxlength="2048" value="${esc(s.stream_url)}"></div><div class="field"><label>Live points</label><input name="live_points" type="number" min="0" max="100000" value="${num(s.live_points)}" required></div><div class="field"><label>VOD points</label><input name="vod_points" type="number" min="0" max="100000" value="${num(s.vod_points)}" required></div></div><div class="actions"><button type="submit" class="secondary">Save details</button><button type="button" data-toggle="${s.id}" class="${s.live_enabled?'secondary':''}">${s.live_enabled?'End Live':'Make Live'}</button><button type="button" data-archive="${s.id}" class="danger">Archive</button></div></form></article>`).join(''):'<p class="muted">No secrets yet. Create the first one above.</p>';
$('leaderboard').innerHTML=table(['Username','Live points','VOD points','Total points','Unique secrets'],(ld.leaderboard||[]).map(v=>[v.username,num(v.live_points),num(v.vod_points),num(v.live_points)+num(v.vod_points),num(v.unique_secrets)]));
$('redemptions').innerHTML=table(['Viewer','Stream','Type','Points','Redeemed'],(rd.redemptions||[]).map(r=>[r.username,r.stream_title,String(r.score_type).toUpperCase(),num(r.points),r.redeemed_at]));
$('secretsList').querySelectorAll('form[data-edit]').forEach(f=>f.addEventListener('submit',async e=>{e.preventDefault();const id=f.dataset.edit;const fd=new FormData(f);try{await action(id,{action:'update',stream_title:fd.get('stream_title'),stream_url:fd.get('stream_url'),live_points:Number(fd.get('live_points')),vod_points:Number(fd.get('vod_points'))});status('globalStatus','Secret details saved.')}catch(err){status('globalStatus',err.message,true)}}));
$('secretsList').querySelectorAll('[data-toggle]').forEach(b=>b.addEventListener('click',async()=>{const s=(sd.secrets||[]).find(x=>String(x.id)===b.dataset.toggle);try{await action(b.dataset.toggle,{action:'toggle-live',live_enabled:!Boolean(s.live_enabled)});status('globalStatus',s.live_enabled?'Live scoring ended.':'Secret is Live now.')}catch(err){status('globalStatus',err.message,true)}}));
$('secretsList').querySelectorAll('[data-archive]').forEach(b=>b.addEventListener('click',async()=>{if(!confirm('Archive this secret? Existing redemption history will be preserved.'))return;try{await action(b.dataset.archive,{action:'archive'});status('globalStatus','Secret archived; redemption history preserved.')}catch(err){status('globalStatus',err.message,true)}}));
}
function table(headers,rows){if(!rows.length)return '<p class="muted">No records yet.</p>';return '<table><thead><tr>'+headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
checkSession().catch(e=>status('globalStatus',e.message,true));
</script></body></html>
