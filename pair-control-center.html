<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pair Control Center</title><style>body{font:16px Arial;background:#171621;color:#fff;max-width:540px;margin:70px auto;padding:20px}button{padding:12px 18px}code{font-size:27px;letter-spacing:3px}p{line-height:1.5}</style></head><body><h1>Pair Aepuns Control Center</h1><p>First sign into <a style="color:#c8b6ff" href="/admin-secrets.html">the existing Secrets admin page</a> in this same browser. Then return here.</p><button id="create">Generate one-time pairing code</button><p id="message"></p><code id="code"></code><p>Enter this code into Control Center → Secrets. It expires after 10 minutes and works only once. Keep it private.</p><script>document.getElementById('create').onclick=async()=>{const out=document.getElementById('message');out.textContent='Generating…';try{const r=await fetch('https://aepuns-secrets-api.sheav06.workers.dev/admin/device/pair-code',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:'{}'});const v=await r.json();if(!r.ok)throw Error(v.error||'Not authorized');document.getElementById('code').textContent=v.code;out.textContent='Code ready (expires in 10 minutes).';}catch(e){out.textContent=e.message+' — Sign into the Secrets admin first.';}};</script></body></html>
