<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>secrets monitor | aepuns</title><link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@1,700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{background:#111;color:#fff;font:700 italic 15px Roboto,Arial,sans-serif;margin:0;padding:18px}h1{font-size:21px;margin:0 0 6px}.note{color:#bbb;font-size:12px;margin:0 0 16px}.row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #555;padding:10px 0}.muted{color:#aaa}button{background:white;color:#111;border:0;border-radius:5px;padding:11px 14px;font:inherit;cursor:pointer}button:hover{background:#ddd}button:disabled{opacity:.5}.status{margin-top:14px;font-size:12px;color:#aaa}#history{margin-top:14px}a{color:#fff}</style></head><body><h1>secrets monitor</h1><p class="note">private admin monitor • live discoveries only • no sound</p><button id="test">test alert</button><div class="status" id="status">connecting…</div><div id="history"></div><script>
const API='https://aepuns-secrets-api.sheav06.workers.dev';const status=document.getElementById('status'),history=document.getElementById('history');let seen=null;
async function api(path,opts={}){const r=await fetch(API+path,{credentials:'include',cache:'no-store',...opts});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'HTTP '+r.status);return d}
function show(e){const row=document.createElement('div');row.className='row';const name=document.createElement('span');name.textContent=(e.kind==='test'?'[TEST] ':'')+e.username;const meta=document.createElement('span');meta.textContent='+'+e.points+' pts · '+new Date(e.created_at*1000).toLocaleTimeString();row.append(name,meta);history.prepend(row);while(history.children.length>40)history.lastElementChild.remove()}
async function poll(){try{const d=await api('/admin/alerts?after='+(seen===null?0:seen));if(seen===null){for(const e of (d.events||[]).slice(-15))show(e)}else{for(const e of d.events||[])if(e.id>seen)show(e)}seen=Math.max(seen||0,Number(d.latest)||0);status.textContent='connected · waiting for discoveries'}catch(e){status.textContent=e.message==='Admin access required'?'sign in at aepuns.ca/admin-secrets.html first, then refresh this page':e.message}}
document.getElementById('test').addEventListener('click',async()=>{if(!confirm('Are you sure you want to send a test alert to OBS? No points will be awarded.'))return;const btn=document.getElementById('test');btn.disabled=true;try{await api('/admin/alerts/test',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});status.textContent='test alert sent'}catch(e){status.textContent=e.message}finally{btn.disabled=false}});
poll();setInterval(poll,2500);
</script></body></html>
