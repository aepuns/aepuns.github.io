<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aepuns Secret Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@1,700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}
body{font:700 italic 16px Roboto,Arial,sans-serif;color:#000}
.slot{position:absolute;right:0.5%;bottom:1.0%;width:10.8%;height:14.4%;overflow:visible;display:grid;place-items:center}
.slide{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;transition:transform .7s cubic-bezier(.45,0,.55,1);transform:translateX(0);will-change:transform}
/* Move each slide beyond the actual viewport edge, not just its own container. */
.slide.out,.slide.enter{transform:translateX(calc(100% + 0.5vw + 2px))}
#logo{max-width:95%;max-height:95%;object-fit:contain}
.fallback{font-size:clamp(16px,3.5vw,72px)}
.alert{width:100%;padding:0 3%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1px;white-space:nowrap;line-height:1.08}
.line{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.title{overflow:visible;text-overflow:clip}
.title{font-size:clamp(7px,1.05vw,21px)}
.name{font-size:clamp(6px,.9vw,18px)}
.points{font-size:clamp(6px,.82vw,17px)}
</style>
</head>
<body>
<div class="slot">
  <div id="logoSlide" class="slide"><img id="logo" src="logo.png" alt="" onerror="this.style.display='none';document.getElementById('fallback').hidden=false"><span class="fallback" id="fallback" hidden>&amp;</span></div>
  <div id="alertSlide" class="slide enter"><div class="alert"><span id="alertTitle" class="line title">secret found!</span><span id="viewer" class="line name">by viewer</span><span id="points" class="line points">+10 pts</span></div></div>
</div>
<script>
const logoSlide=document.getElementById('logoSlide'),alertSlide=document.getElementById('alertSlide'),viewer=document.getElementById('viewer'),points=document.getElementById('points'),alertTitle=document.getElementById('alertTitle');
let queue=[],busy=false;
function fit(el){el.style.fontSize='';const max=el.parentElement.clientWidth*.94;let size=parseFloat(getComputedStyle(el).fontSize);while(el.scrollWidth>max&&size>4){size-=.25;el.style.fontSize=size+'px'}}
function fitAlert(){fit(alertTitle);fit(viewer);fit(points)}
window.addEventListener('resize',fitAlert);
window.addEventListener('load',fitAlert);
async function wait(ms){return new Promise(r=>setTimeout(r,ms))}
async function showNext(){
 if(busy||!queue.length)return;
 busy=true;
 const item=queue.shift();
 viewer.textContent='by '+String(item.username||'viewer');
 points.textContent='+'+Math.max(0,Number(item.points)||0)+' pts';
 fitAlert();
 logoSlide.classList.add('out');
 await wait(750);
 alertSlide.classList.remove('enter');
 await wait(5000);
 alertSlide.classList.add('out');
 await wait(750);
 logoSlide.classList.remove('out');
 await wait(750);
 alertSlide.classList.remove('out');
 alertSlide.classList.add('enter');
 busy=false;
 showNext();
}
function enqueue(data){queue.push(data);showNext()}
window.addEventListener('storage',e=>{if(e.key==='aepuns-test-alert'&&e.newValue){try{enqueue(JSON.parse(e.newValue))}catch{}}});
const params=new URLSearchParams(location.search);
if(params.has('preview'))setTimeout(()=>enqueue({username:'Aepuns',points:10}),1000);
const token=params.get('token');
const API='https://aepuns-secrets-api.sheav06.workers.dev';
let lastSeen=null;
async function poll(){
 if(!token)return;
 try{
  const query=new URLSearchParams({token,after:String(lastSeen===null?0:lastSeen)});
  const response=await fetch(API+'/overlay/alerts?'+query,{cache:'no-store',referrerPolicy:'no-referrer'});
  if(!response.ok)throw new Error('Alert feed '+response.status);
  const data=await response.json();
  if(lastSeen!==null){for(const event of data.events||[]){if(event.id>lastSeen)enqueue(event)}}
  lastSeen=Math.max(lastSeen||0,Number(data.latest)||0);
 }catch(error){console.warn('Secrets overlay:',error.message)}
}
if(token){poll();setInterval(poll,2000)}
</script>
</body>
</html>
