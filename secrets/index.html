<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>secrets | aepuns</title>
<link rel="icon" type="image/png" href="../images/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@1,400;1,700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{font-family:Roboto,Arial,sans-serif;color:#111;background:#fff}
body{margin:0;min-height:100vh;display:grid;place-items:center;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background:#fff url("../images/ampersandbg.png") repeat;background-size:700px auto;animation:roll 45s linear infinite;z-index:-1}
@keyframes roll{to{background-position:700px 700px}}
main{width:min(92vw,600px);padding:clamp(24px,5vw,48px);background:#fff;border:3px solid #111;border-radius:12px;box-shadow:9px 9px 0 #111;text-align:center}
.logo{display:block;width:min(185px,48%);height:auto;margin:0 auto 12px}
h1{font-size:clamp(2rem,7vw,3rem);font-style:italic;line-height:1;margin:12px 0 18px}
p{line-height:1.5}
.intro{font-style:italic;margin-bottom:28px}
form{display:flex;gap:10px;flex-wrap:wrap}
input,button{font:italic 700 1rem Roboto,Arial,sans-serif;border:2px solid #111;border-radius:7px;padding:13px 15px}
input{flex:1 1 210px;min-width:0;background:#fff;color:#111}
button{flex:0 0 auto;background:#111;color:#fff;cursor:pointer;transition:transform .15s,box-shadow .15s}
button:hover{transform:translateY(-2px);box-shadow:0 4px 0 #888}
button:focus-visible,input:focus-visible{outline:3px solid #777;outline-offset:3px}
#status{min-height:1.5em;font-size:.95rem}
.note{font-size:.8rem;opacity:.7;font-style:italic}
@media(prefers-color-scheme:dark){
:root{color:#fff;background:#000}
body::before{background-color:#000;background-image:url("../images/ampersandbg-dark.png")}
main{background:#101010;border-color:#fff;box-shadow:9px 9px 0 #fff}
input{background:#171717;color:#fff;border-color:#fff}
button{background:#fff;color:#111;border-color:#fff}
}
@media(prefers-reduced-motion:reduce){body::before{animation:none}button{transition:none}}
</style>
</head>
<body>
<main>
<img class="logo" src="../images/aepunslogo.png" alt="aepuns">
<h1>secret leaderboard</h1>
<p class="intro">heard a secret word on stream? try your luck.</p>
<form id="claim-form">
<input id="guess" aria-label="Secret word" autocomplete="off" maxlength="100" required placeholder="enter secret word">
<button type="submit">claim</button>
</form>
<p id="status" role="status"></p>
<p class="note">claims are coming soon. the secret words are never stored in this page.</p>
</main>
<script>
document.getElementById("claim-form").addEventListener("submit",event=>{
event.preventDefault();
document.getElementById("status").textContent="claims aren't enabled yet.";
});
</script>
</body>
</html>
