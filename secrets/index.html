<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Secrets | aepuns</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #141414; color: #f4f4f4; }
    main { width: min(90vw, 520px); padding: 2rem; border: 1px solid #555; border-radius: 16px; }
    input,button { font: inherit; padding: .8rem; border-radius: 8px; }
    input { background: #252525; border: 1px solid #777; color: white; flex: 1; min-width: 0; }
    button { cursor: pointer; background: white; color: black; border: 0; }
    form { display: flex; gap: .5rem; }
    #status { min-height: 1.5em; }
    small { color: #bbb; }
  </style>
</head>
<body>
  <main>
    <h1>secret leaderboard</h1>
    <p>Heard something suspicious on stream? Try a secret word.</p>
    <form id="claim-form">
      <input id="guess" aria-label="Secret word" autocomplete="off" maxlength="100" required placeholder="secret word">
      <button type="submit">Submit</button>
    </form>
    <p id="status" role="status"></p>
    <small>Secret claims are not available until the secure backend is connected.</small>
  </main>
  <script>
    // No secret words, hashes, validation lists, or admin credentials belong in this public file.
    document.getElementById("claim-form").addEventListener("submit", (event) => {
      event.preventDefault();
      document.getElementById("status").textContent = "Claims aren't enabled yet.";
    });
  </script>
</body>
</html>
