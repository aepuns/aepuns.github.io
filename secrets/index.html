<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>secrets | aepuns</title>
<link rel="icon" type="image/png" href="../images/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@1,400;1,700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{font-family:Roboto,Arial,sans-serif;color:#111;background:#fff}
body{margin:0;min-height:100vh;display:grid;place-items:center;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background:#fff url("../images/ampersandbg.png") repeat;background-size:700px auto;animation:roll 45s linear infinite;z-index:-1}
@keyframes roll{to{background-position:700px 700px}}
main{width:min(92vw,620px);padding:48px 0}
form{display:flex;gap:10px}
input,button,.signin{font:italic 700 1rem Roboto,Arial,sans-serif;border:2px solid #111;border-radius:7px;padding:14px 16px}
input{flex:1;min-width:0;background:#fff;color:#111}
button{background:#111;color:#fff;cursor:pointer;transition:transform .15s,box-shadow .15s}
button:hover{transform:translateY(-2px);box-shadow:0 4px 0 #888}
button:disabled{opacity:.6;cursor:wait;transform:none}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #777;outline-offset:3px}
#status{min-height:1.5em;text-align:center;font-size:.9rem;font-style:italic}
#account{text-align:center;font-size:.85rem;font-style:italic;margin:8px 0 18px}
#account a{color:inherit}
#leaderboard{margin-top:32px;border:2px solid currentColor;border-radius:10px;background:#fff;padding:18px}
h2{font-size:1.2rem;font-style:italic;margin:0 0 14px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{font-size:.85rem;padding:10px 14px}
.tabs button[aria-selected="false"]{background:transparent;color:#111}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font:italic 700 .88rem Roboto,Arial,sans-serif}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #aaa}
th:first-child,td:first-child{width:44px}
th:last-child,td:last-child{text-align:right}
#board-status{font-size:.85rem;font-style:italic;margin:8px 0}
#refresh{font-size:.78rem;padding:7px 12px;margin-top:12px}
@media(prefers-color-scheme:dark){
:root{color:#fff;background:#000}
body::before{background-color:#000;background-image:url("../images/ampersandbg-dark.png")}
input{background:#171717;color:#fff;border-color:#fff}
button{background:#fff;color:#111;border-color:#fff}
#leaderboard{background:#171717}
.tabs button[aria-selected="false"]{color:#fff}
}
@media(max-width:400px){form{flex-direction:column}}
@media(prefers-reduced-motion:reduce){body::before{animation:none}button{transition:none}}
</style>
</head>
<body>
<main>
<form id="claim-form">
<input id="guess" aria-label="Secret word" autocomplete="off" maxlength="100" required placeholder="enter word">
<button id="submit" type="submit">submit</button>
</form>
<p id="status" role="status" aria-live="polite"></p>
<div id="account">checking sign-in…</div>
<section id="leaderboard" aria-labelledby="leaderboard-title">
<h2 id="leaderboard-title">leaderboard</h2>
<div class="tabs" role="tablist" aria-label="Leaderboard rankings">
<button type="button" id="total-tab" role="tab" aria-selected="true" aria-controls="rankings">total points</button>
<button type="button" id="live-tab" role="tab" aria-selected="false" aria-controls="rankings">live points</button>
</div>
<div id="rankings" role="tabpanel" aria-labelledby="total-tab" class="table-wrap">
<table><thead><tr><th scope="col">#</th><th scope="col">username</th><th scope="col" id="score-heading">total points</th></tr></thead><tbody id="rank-rows"></tbody></table>
</div>
<p id="board-status" role="status">loading rankings…</p>
<button type="button" id="refresh">refresh rankings</button>
</section>
</main>
<script>
const API = 'https://aepuns-secrets-api.sheav06.workers.dev';
const loginURL = API + '/test-login';
const status = document.getElementById('status');
const account = document.getElementById('account');
const submit = document.getElementById('submit');
const rankRows = document.getElementById('rank-rows');
const boardStatus = document.getElementById('board-status');
const totalTab = document.getElementById('total-tab');
const liveTab = document.getElementById('live-tab');
let leaderboard = [];
let mode = 'total';

async function getJSON(path, options = {}) {
  const response = await fetch(API + path, { credentials: 'include', cache: 'no-store', ...options });
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || 'request failed');
  return data;
}
async function checkAccount() {
  try {
    const data = await getJSON('/auth/me');
    if (data.authenticated) {
      account.textContent = 'signed in as ' + data.username;
    } else {
      account.replaceChildren();
      account.append('sign in to redeem words: ');
      const link = document.createElement('a');
      link.href = loginURL;
      link.textContent = 'google sign-in';
      account.append(link);
    }
  } catch {
    account.textContent = 'could not check sign-in status';
  }
}
function renderLeaderboard() {
  totalTab.setAttribute('aria-selected', String(mode === 'total'));
  liveTab.setAttribute('aria-selected', String(mode === 'live'));
  document.getElementById('rankings').setAttribute('aria-labelledby', mode === 'total' ? 'total-tab' : 'live-tab');
  document.getElementById('score-heading').textContent = mode === 'total' ? 'total points' : 'live points';
  const sorted = [...leaderboard].sort((a, b) => {
    const aScore = mode === 'total' ? a.total_points : a.live_points;
    const bScore = mode === 'total' ? b.total_points : b.live_points;
    return bScore - aScore || b.total_points - a.total_points || a.username.localeCompare(b.username);
  });
  rankRows.replaceChildren();
  sorted.forEach((entry, index) => {
    const tr = document.createElement('tr');
    const rank = document.createElement('td');
    const name = document.createElement('td');
    const score = document.createElement('td');
    rank.textContent = String(index + 1);
    name.textContent = entry.username;
    score.textContent = String(mode === 'total' ? entry.total_points : entry.live_points);
    tr.append(rank, name, score);
    rankRows.append(tr);
  });
  boardStatus.textContent = sorted.length ? '' : 'no rankings yet.';
}
async function loadLeaderboard() {
  boardStatus.textContent = 'loading rankings…';
  try {
    const data = await getJSON('/leaderboard');
    leaderboard = data.leaderboard || [];
    renderLeaderboard();
  } catch (error) {
    boardStatus.textContent = 'could not load rankings: ' + error.message;
  }
}
totalTab.addEventListener('click', () => { mode = 'total'; renderLeaderboard(); });
liveTab.addEventListener('click', () => { mode = 'live'; renderLeaderboard(); });
document.getElementById('refresh').addEventListener('click', loadLeaderboard);
document.getElementById('claim-form').addEventListener('submit', async event => {
  event.preventDefault();
  const word = document.getElementById('guess').value.trim();
  if (!word) return;
  submit.disabled = true;
  status.textContent = 'checking word…';
  try {
    const data = await getJSON('/secrets/redeem', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ word })
    });
    status.textContent = '+' + data.points + ' ' + data.score_type + ' points for ' + data.stream_title + '!';
    document.getElementById('guess').value = '';
    await loadLeaderboard();
  } catch (error) {
    status.textContent = error.message;
    if (/sign in/i.test(error.message)) await checkAccount();
  } finally {
    submit.disabled = false;
  }
});
checkAccount();
loadLeaderboard();
</script>
</body>
</html>
