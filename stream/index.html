<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>stream | aepuns</title><meta name="color-scheme" content="light dark"><style>
:root{font-family:Roboto,Arial,sans-serif;color:#111;background:#f5f5f5}*{box-sizing:border-box}body{margin:0}main{max-width:1150px;padding:28px 18px;margin:auto}h1{font-size:32px}h2{font-size:21px}.cols{display:grid;grid-template-columns:2fr 1fr;gap:15px}.offline{min-height:300px;background:#090909;color:white;display:grid;place-items:center;font-weight:700;font-size:30px}.chat{min-height:300px}.panel{background:#fff;border:1px solid #ddd;padding:18px;border-radius:10px;margin:15px 0}button{font:inherit;cursor:pointer;border:1px solid #222;background:#fff;border-radius:7px;padding:8px 12px}button:disabled{opacity:.6;cursor:not-allowed}.tags{display:flex;flex-wrap:wrap;gap:7px}.active{background:#111;color:white}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:10px;margin-top:14px}.reaction{display:flex;align-items:center;flex-direction:column;gap:5px;min-height:126px}.reaction img{width:80px;height:80px;object-fit:contain;image-rendering:pixelated}.credit{font-size:12px;color:#555;overflow-wrap:anywhere;text-align:center}.credit a{color:inherit;text-decoration:underline}.status{min-height:22px;font-size:14px;color:#555}.fine{font-size:12px;color:#777;text-align:center;margin:50px 0 10px}@media(max-width:720px){.cols{grid-template-columns:1fr}.offline,.chat{min-height:190px}}

/* Accessible automatic theme plus explicit visitor choice. */
:root{color-scheme:light;--page:#f5f5f5;--text:#141414;--panel:#fff;--border:#d9d9d9;--muted:#555;--button:#fff;--button-text:#171717;--active:#161616;--active-text:white}
:root[data-theme="dark"]{color-scheme:dark;--page:#111019;--text:#f4f1fa;--panel:#1c1928;--border:#40384f;--muted:#c1b8cd;--button:#292436;--button-text:#f4f1fa;--active:#c3a4ff;--active-text:#130b22}
html{background:var(--page)}
body{background:var(--page);color:var(--text);min-height:100vh}.panel{background:var(--panel);border-color:var(--border)}button{background:var(--button);border-color:var(--border);color:var(--button-text)}button.active{background:var(--active);color:var(--active-text)}.status,.credit{color:var(--muted)}a{color:inherit}.offline{background:#08080a;color:white}
.topline{display:flex;align-items:center;justify-content:space-between;gap:14px}.theme-toggle{white-space:nowrap}
.reaction button{position:relative;overflow:hidden;isolation:isolate}.reaction button:disabled{opacity:1;cursor:not-allowed}
.reaction button img{display:block}.reaction .shade{position:absolute;inset:0;background:rgba(107,107,112,.68);transform-origin:bottom;transform:scaleY(0);pointer-events:none;z-index:1;transition:transform .2s linear}
.reaction button.waiting .shade{transform:scaleY(var(--shade,1))}.reaction button.offline .shade{transform:scaleY(1)}
.reaction button.waiting,.reaction button.offline{filter:grayscale(1)}
.reaction button .remaining{position:absolute;inset:0;display:grid;place-items:center;z-index:2;font-size:13px;font-weight:750;color:#fff;text-shadow:0 1px 3px #111;pointer-events:none}
.cooldown-track{height:6px;background:var(--border);border-radius:9px;overflow:hidden;max-width:360px;margin:8px 0}.cooldown-track>div{height:100%;width:0;background:var(--active);transition:width .1s linear}
@media(prefers-reduced-motion:reduce){.reaction .shade,.cooldown-track>div{transition:none}}
dialog#leaderboardDialog{width:min(95vw,650px);max-height:90vh;padding:16px;border:1px solid var(--border);border-radius:12px;background:var(--panel);color:var(--text)}dialog#leaderboardDialog::backdrop{background:rgba(0,0,0,.7)}.board-header{display:flex;justify-content:space-between;align-items:center;gap:12px}.board-header h2{margin:0 0 10px}@media(max-width:450px){dialog#leaderboardDialog{padding:10px}#secretsFrame{height:300px!important}}
:root{--accent:#7f46db;--accent-text:#fff;--active:var(--accent);--active-text:var(--accent-text)}
:root[data-theme="dark"]{--active:var(--accent);--active-text:var(--accent-text)}
button.active{background:var(--accent);color:var(--accent-text)}
#settingsDialog{width:min(95vw,600px);max-height:90vh;overflow:auto;border:1px solid var(--border);border-radius:14px;background:var(--panel);color:var(--text);padding:18px}
#settingsDialog::backdrop{background:rgba(0,0,0,.68)}
.settings-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.settings-head h2{margin:0}
.settings-group{border-top:1px solid var(--border);padding-top:14px;margin-top:15px}
.settings-group h3{margin:0 0 10px;font-size:17px}
.settings-options{display:flex;flex-wrap:wrap;gap:8px}
.settings-options button[aria-pressed="true"]{border:2px solid var(--accent);box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent)}
#settingsDialog button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.color-choice{min-width:82px;display:flex;align-items:center;justify-content:center;gap:7px}
.color-choice .dot{width:15px;height:15px;border-radius:50%;background:var(--swatch);border:1px solid #777}
#accountFrame{width:100%;height:280px;border:0;background:transparent}

/* Apply the chosen hue to the entire interface, not only its buttons. */
:root[data-theme]{--page:color-mix(in srgb,var(--theme-base) 88%,var(--theme-color));--panel:color-mix(in srgb,var(--theme-surface) 89%,var(--theme-color));--button:color-mix(in srgb,var(--theme-surface) 81%,var(--theme-color));--border:color-mix(in srgb,var(--theme-color) 38%,var(--theme-base));}
:root[data-theme="light"]{--theme-base:#fff;--theme-surface:#fff}
:root[data-theme="dark"]{--theme-base:#090909;--theme-surface:#202020}
body,html{background:var(--page)}
#settingsDialog,#leaderboardDialog{background:var(--panel);border-color:var(--border)}
</style></head><body><main><div class="topline"><a href="/">← Home</a><button type="button" class="theme-toggle" id="themeToggle" aria-haspopup="dialog">⚙ Settings</button></div><h1>stream</h1><section class="panel"><h2>send a reaction</h2><p id="availability" class="status">Loading reactions…</p><div id="tags" class="tags"></div><div id="gallery" class="gallery"></div><p id="sent" class="status" role="status" aria-live="polite"></p><div class="cooldown-track" aria-hidden="true"><div id="cooldownProgress"></div></div></section><section class="panel"><h2>secrets</h2><iframe title="Enter a secret word and manage your account" id="secretsFrame" src="/secrets/?view=compact" onload="this.contentWindow.postMessage(themeMessage(),location.origin)" style="width:100%;height:270px;border:0;background:transparent" loading="lazy"></iframe><button type="button" id="leaderboardOpen" aria-haspopup="dialog">🏆 View leaderboard</button></section><dialog id="settingsDialog" aria-labelledby="settingsTitle"><div class="settings-head"><h2 id="settingsTitle">Settings</h2><button id="settingsClose" type="button">✕ Close</button></div><section class="settings-group"><h3>Appearance</h3><p>Display mode</p><div id="modeChoices" class="settings-options"></div><p>Accent color</p><div id="colorChoices" class="settings-options"></div></section><section class="settings-group"><h3>Account</h3><iframe title="Google sign-in and account settings" id="accountFrame" src="about:blank"></iframe></section></dialog><dialog id="leaderboardDialog" aria-labelledby="leaderboardTitle"><div class="board-header"><h2 id="leaderboardTitle">leaderboard</h2><button type="button" id="leaderboardClose" aria-label="Close leaderboard">✕ Close</button></div><iframe title="Leaderboard rankings" id="leaderboardFrame" src="about:blank" style="width:100%;height:min(65vh,600px);border:0;background:transparent"></iframe></dialog><footer class="fine" id="schedule" hidden>Regular streams: Monday and Friday, 10 PM Atlantic. Additional weekday stream when possible.</footer></main><script>
window.addEventListener('message',event=>{
 if(event.origin!==location.origin||![document.getElementById('secretsFrame').contentWindow,document.getElementById('accountFrame').contentWindow].includes(event.source)||!['aepuns-secrets-height','aepuns-secrets-signin'].includes(event.data?.type))return;
 if(event.data.type==='aepuns-secrets-signin'){openSettings();return}
 const height=Number(event.data.height);
 if(Number.isFinite(height)&&height>0&&height<3000)(event.source===accountFrame.contentWindow?accountFrame:document.getElementById('secretsFrame')).style.height=(height+8)+'px';
});
window.addEventListener('message',event=>{
 if(event.origin!==location.origin||event.source!==document.getElementById('accountFrame').contentWindow||event.data?.type!=='aepuns-account-signed-in')return;
 document.getElementById('secretsFrame').contentWindow?.postMessage({type:'aepuns-check-login'},location.origin);
 settingsDialog.close();
});
const boardDialog=document.getElementById('leaderboardDialog');
const boardFrame=document.getElementById('leaderboardFrame');
document.getElementById('leaderboardOpen').addEventListener('click',()=>{
 if(boardFrame.getAttribute('src')==='about:blank')boardFrame.src='/secrets/?view=board';
 boardDialog.showModal();
});
document.getElementById('leaderboardClose').addEventListener('click',()=>boardDialog.close());
boardDialog.addEventListener('click',e=>{if(e.target===boardDialog)boardDialog.close()});
boardFrame.addEventListener('load',()=>notifyFrames());
const API='https://api.aepuns.ca';
const tags=document.getElementById('tags'),gallery=document.getElementById('gallery'),available=document.getElementById('availability'),sent=document.getElementById('sent');
const timerBar=document.getElementById('cooldownProgress');
let data={items:[],tags:[],enabled:false,live:false,cooldown:5},selected='All',sending=false;
const cooldownKey='aepuns-reactions-cooldown-end-v04';
let cooldownEnd=Number(localStorage.getItem(cooldownKey)||0);
let cooldownLength=Number(localStorage.getItem(cooldownKey+'-duration')||0);
let renderedSignature='';
const themeToggle=document.getElementById('themeToggle');
const settingsDialog=document.getElementById('settingsDialog');
const accountFrame=document.getElementById('accountFrame');
const systemTheme=matchMedia('(prefers-color-scheme: dark)');
const modes=['auto','light','dark'];
const accents={red:'#c73543',orange:'#bd6416',yellow:'#977000',green:'#247d47',blue:'#3266c7',purple:'#7f46db'};
const lightAccents={red:'#bd303e',orange:'#ae5410',yellow:'#886400',green:'#19703d',blue:'#2758bc',purple:'#7137ca'};
const darkAccents={red:'#ff7883',orange:'#ffad65',yellow:'#f4d35e',green:'#69d99b',blue:'#8caeff',purple:'#c3a4ff'};
let themeChoice=localStorage.getItem('aepuns-stream-theme')||'auto';
if(!modes.includes(themeChoice))themeChoice='auto';
let accentChoice=localStorage.getItem('aepuns-stream-accent')||'purple';
if(!Object.hasOwn(accents,accentChoice))accentChoice='purple';
function themeMessage(){
 const root=document.documentElement;
 return {type:'aepuns-theme',theme:root.dataset.theme,accent:root.style.getPropertyValue('--accent'),accentText:root.style.getPropertyValue('--accent-text'),themeColor:root.style.getPropertyValue('--theme-color')};
}
function notifyFrames(){
 for(const frame of [document.getElementById('secretsFrame'),boardFrame,accountFrame]){
  if(frame?.contentWindow)frame.contentWindow.postMessage(themeMessage(),location.origin);
 }
}
function setTheme(){
 const resolved=themeChoice==='auto'?(systemTheme.matches?'dark':'light'):themeChoice;
 const accent=(resolved==='dark'?darkAccents:lightAccents)[accentChoice];
 const text=resolved==='dark'?'#17111e':'#fff';
 document.documentElement.dataset.theme=resolved;
 document.documentElement.style.setProperty('--theme-color',accents[accentChoice]);
 document.documentElement.style.setProperty('--accent',accent);
 document.documentElement.style.setProperty('--accent-text',text);
 document.querySelectorAll('#modeChoices button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===themeChoice)));
 document.querySelectorAll('#colorChoices button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.color===accentChoice)));
 notifyFrames();
}
for(const mode of modes){
 const b=document.createElement('button');b.type='button';b.dataset.mode=mode;b.textContent=mode[0].toUpperCase()+mode.slice(1);
 b.onclick=()=>{themeChoice=mode;localStorage.setItem('aepuns-stream-theme',mode);setTheme()};
 document.getElementById('modeChoices').append(b);
}
for(const [name,color] of Object.entries(accents)){
 const b=document.createElement('button');b.type='button';b.className='color-choice';b.dataset.color=name;
 const dot=document.createElement('span');dot.className='dot';dot.style.setProperty('--swatch',color);dot.setAttribute('aria-hidden','true');
 b.append(dot,name[0].toUpperCase()+name.slice(1));
 b.onclick=()=>{accentChoice=name;localStorage.setItem('aepuns-stream-accent',name);setTheme()};
 document.getElementById('colorChoices').append(b);
}
function openSettings(){
 if(accountFrame.getAttribute('src')==='about:blank')accountFrame.src='/secrets/?view=account';
 settingsDialog.showModal();
}
themeToggle.onclick=openSettings;
document.getElementById('settingsClose').onclick=()=>settingsDialog.close();
settingsDialog.addEventListener('click',e=>{if(e.target===settingsDialog)settingsDialog.close()});
accountFrame.addEventListener('load',notifyFrames);
systemTheme.addEventListener?.('change',()=>{if(themeChoice==='auto')setTheme()});
setTheme();
function setCooldown(seconds){cooldownLength=Math.max(0,Number(seconds)||0)*1000;cooldownEnd=Date.now()+cooldownLength;localStorage.setItem(cooldownKey,String(cooldownEnd));localStorage.setItem(cooldownKey+'-duration',String(cooldownLength));updateButtons()}
function updateButtons(){const remaining=Math.max(0,cooldownEnd-Date.now());const offline=!data.enabled;
  for(const b of gallery.querySelectorAll('button[data-reaction]')){
    b.disabled=offline||remaining>0||sending;b.classList.toggle('offline',offline);b.classList.toggle('waiting',!offline&&remaining>0);
    const shade=b.querySelector('.shade'),label=b.querySelector('.remaining');
    if(shade)shade.style.setProperty('--shade',offline?1:cooldownLength?remaining/cooldownLength:0);
    if(label)label.textContent=offline?'':remaining>0?Math.ceil(remaining/1000)+'s':'';
    b.setAttribute('aria-label',offline?'Reactions disabled':remaining>0?'Ready in '+Math.ceil(remaining/1000)+' seconds':'Send reaction');
  }
  timerBar.style.width=!offline&&remaining>0&&cooldownLength?Math.min(100,100*(1-remaining/cooldownLength))+'%':'0%';
  if(!offline&&remaining>0)available.textContent='Cooldown: '+Math.ceil(remaining/1000)+' seconds until you can send another reaction.';
  else if(!data.enabled)available.textContent='Reactions are disabled.';
  else available.textContent='Reactions are enabled. They appear on stream only when the overlay is being broadcast.';
}
function view(){tags.replaceChildren();for(const name of ['All',...data.tags]){const button=document.createElement('button');button.textContent=name;button.className=name===selected?'active':'';button.onclick=()=>{selected=name;view()};tags.append(button)}
 gallery.replaceChildren();for(const r of data.items.filter(x=>selected==='All'||(x.tags||[]).includes(selected))){
  const box=document.createElement('div');box.className='reaction';const b=document.createElement('button');b.dataset.reaction=r.code;b.title='Send reaction';
  const img=new Image();img.src=r.image;img.alt='Reaction artwork by '+(r.artist||'Aepuns');b.append(img);
  const shade=document.createElement('span');shade.className='shade';shade.setAttribute('aria-hidden','true');b.append(shade);
  const remaining=document.createElement('span');remaining.className='remaining';remaining.setAttribute('aria-hidden','true');b.append(remaining);
  b.onclick=async()=>{if(sending||!data.enabled||Date.now()<cooldownEnd)return;sending=true;updateButtons();sent.textContent='Sending…';
   try{const response=await fetch(API+'/reactions/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:r.code})});const result=await response.json();if(!response.ok){if(response.status===429&&result.retry_after)setCooldown(result.retry_after);throw Error(result.error||'Could not send reaction')}
     setCooldown(data.cooldown||0);sent.textContent='Reaction sent!';
   }catch(e){sent.textContent=e.message}finally{sending=false;updateButtons()}};
  const credit=document.createElement('div');credit.className='credit';if(r.artist){credit.append('made by ');if(r.url){const a=document.createElement('a');a.href=r.url;a.rel='noopener noreferrer';a.target='_blank';a.textContent=r.artist;credit.append(a)}else credit.append(r.artist)}
  box.append(b,credit);gallery.append(box)}updateButtons();}
async function refresh(){try{const response=await fetch(API+'/reactions/config',{cache:'no-store'});if(!response.ok)throw Error('Reactions unavailable');const newer=await response.json();data=newer;
  const signature=JSON.stringify({tags:newer.tags,items:newer.items.map(x=>[x.code,x.artist,x.url,x.image,x.tags])});
  if(!newer.tags.includes(selected)&&selected!=='All')selected='All';
  if(signature!==renderedSignature){renderedSignature=signature;view()}else updateButtons();
 }catch(e){available.textContent=e.message;data.enabled=false;updateButtons()}}
refresh();setInterval(refresh,10000);setInterval(updateButtons,100);
async function refreshScheduleVisibility(){
 try{
  const response=await fetch(API+'/site/options',{cache:'no-store'});
  if(!response.ok)throw Error('Site options '+response.status);
  const options=await response.json();
  document.getElementById('schedule').hidden=options.scheduleVisible!==true;
 }catch(error){
  document.getElementById('schedule').hidden=true;
  console.warn('Stream schedule visibility:',error.message);
 }
}
refreshScheduleVisibility();
setInterval(refreshScheduleVisibility,30000);
// Display each recurring time in the visitor's time zone based on the upcoming Halifax weekday.
const now=new Date(),fmt=new Intl.DateTimeFormat('en-US',{timeZone:'America/Halifax',year:'numeric',month:'numeric',day:'numeric',weekday:'short'}),parts=Object.fromEntries(fmt.formatToParts(now).map(p=>[p.type,p.value]));
const base=new Date(Date.UTC(+parts.year,+parts.month-1,+parts.day));let times=[];for(const day of [1,5]){let date=new Date(base);let delta=(day-date.getUTCDay()+7)%7;date.setUTCDate(date.getUTCDate()+delta);const test=new Date(Date.UTC(date.getUTCFullYear(),date.getUTCMonth(),date.getUTCDate(),22));const tztime=new Intl.DateTimeFormat('en-US',{timeZone:'America/Halifax',hour:'numeric',hourCycle:'h23'}).format(test);const offset=Number(tztime)-22;let utc=new Date(test.getTime()-offset*3600000);times.push(new Intl.DateTimeFormat(undefined,{weekday:'long',hour:'numeric',minute:'2-digit',timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone}).format(utc))}document.getElementById('schedule').textContent='Regular streams (your local time): '+times.join(' · ')+' · Extra weekday stream when possible.';
</script></body></html>
