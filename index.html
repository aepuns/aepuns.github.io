    <script>
        try {
            if (sessionStorage.getItem("return-to-bubble")) {
                document.documentElement.classList.add("returning-from-bubble");
            }
            if (localStorage.getItem("disable-bubble-zoom") === "true") {
                document.documentElement.classList.add("disable-bubble-zoom");
            }
            if (localStorage.getItem("disable-background-motion") === "true") {
                document.documentElement.classList.add("disable-background-motion");
            }
        } catch (error) {}
    </script>

    <link
        rel="stylesheet"
        href="css/style.css?v=2">

    <style>
        /* Additional-pages tray: independent of the five fixed homepage bubbles. */
        #additional-pages-tray { position:fixed; bottom:0; left:0; right:0; z-index:1000; pointer-events:none; font-family:Roboto,Arial,sans-serif; --tray-fg:#111; --tray-bg:rgba(255,255,255,.84); }
        #tray-toggle { position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:52px; height:34px; border:0; padding:0; background:transparent; color:var(--tray-fg); opacity:.66; cursor:pointer; pointer-events:auto; transition:transform .25s ease,opacity .25s ease,bottom .3s ease; font:700 25px Roboto,Arial,sans-serif; }
#tray-toggle .tray-arrow { display:block; margin:auto; width:0; height:0; border-left:19px solid transparent; border-right:19px solid transparent; border-bottom:10px solid currentColor; transition:transform .25s ease; }
        #additional-pages-tray.is-open #tray-toggle .tray-arrow { transform:scaleY(-1); }
        #tray-toggle:hover,#tray-toggle:focus-visible { transform:translateX(-50%) scale(1.15); opacity:1; }
        #tray-toggle:focus-visible { outline:2px solid currentColor; outline-offset:2px; }
        #tray-panel { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:10px; min-height:65px; padding:18px 18px 21px; background:var(--tray-bg); color:var(--tray-fg); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-top:1px solid rgba(128,128,128,.2); transform:translateY(100%); transition:transform .35s ease; pointer-events:none; }
        #tray-panel a { color:inherit; font-size:clamp(14px,3.5vw,17px); text-decoration:none; font-weight:500; transition:opacity .2s ease,transform .2s ease; }
        #tray-panel a:hover,#tray-panel a:focus-visible { opacity:.7; transform:scale(1.04); text-decoration:underline; }
        #tray-panel .tray-separator { opacity:.6; }
        #additional-pages-tray.is-open #tray-panel { transform:translateY(0); pointer-events:auto; }
        #additional-pages-tray.is-open #tray-toggle { bottom:64px; }
        @media (prefers-color-scheme:dark) { #additional-pages-tray { --tray-fg:#fff; --tray-bg:rgba(17,17,17,.84); } }
        @media (prefers-reduced-motion:reduce) { #tray-toggle,#tray-panel,#tray-panel a { transition:none; } }
        body.is-transitioning #additional-pages-tray,body.is-returning-home #additional-pages-tray { opacity:0; pointer-events:none; }
    </style>

    <link rel="preload" as="image" href="images/bubble1-updates-blank.png">
    <link rel="preload" as="image" href="images/bubble2-music-blank.png">
    <link rel="preload" as="image" href="images/bubble3-about-blank.png">
    <link rel="preload" as="image" href="images/bubble4-projects-art-blank.png">
    <link rel="preload" as="image" href="images/bubble5-socials-blank.png">

</head>

<body>

    <button
        id="settings-button"
        type="button"
        aria-label="Open settings"
        aria-expanded="false"
        aria-controls="settings-panel">&#9881;&#xfe0e;</button>

    <aside id="settings-panel" aria-label="Settings" hidden>
        <h2>settings</h2>
        <label>
            <input id="disable-zoom" type="checkbox">
            disable zoom effect
        </label>
        <label>
            <input id="disable-background" type="checkbox">
            disable moving background
        </label>
    </aside>

    <!-- =========================================
                    WEBSITE
    ========================================== -->

    <main id="website">

        <!-- =====================================
                    HOME STAGE
        ====================================== -->

        <section id="stage">

            <!-- CHARACTER -->

            <img
                id="character"
                src="images/apn-character.png"
                alt="Aepuns Character">

            <!-- LOGO -->

            <img
                id="logo"
                src="images/aepunslogo.png"
                alt="aepuns">

            <!-- ===============================
                    SPEECH BUBBLES
            ================================ -->

            <img
                id="updates"
                class="bubble"
                src="images/bubble1-updates.png"
                alt="Updates">

            <img
                id="point-updates"
                class="point"
                src="images/point1-updates.png"
                alt="">

            <img
                id="music"
                class="bubble"
                src="images/bubble2-music.png"
                alt="Music">

            <img
                id="point-music"
                class="point"
                src="images/point2-music.png"
                alt="">

            <img
                id="about"
                class="bubble"
                src="images/bubble3-about.png"
                alt="About the Puns">

            <img
                id="point-about"
                class="point"
                src="images/point3-about.png"
                alt="">

            <img
                id="projects-art"
                class="bubble"
                src="images/bubble4-projects-art.png"
                alt="Projects and art">

            <img
                id="point-projects-art"
                class="point"
                src="images/point4-projects-art.png"
                alt="">

            <img
                id="socials"
                class="bubble"
                src="images/bubble5-socials.png"
                alt="Socials">

            <img
                id="point-socials"
                class="point"
                src="images/point5-socials.png"
                alt="">

        </section>

    </main>

    <nav id="additional-pages-tray" aria-label="Additional pages">
        <button id="tray-toggle" type="button" aria-expanded="false" aria-controls="tray-panel" aria-label="Open additional pages"><span class="tray-arrow" aria-hidden="true"></span></button>
        <div id="tray-panel" inert></div>
    </nav>

    <p id="site-version">v2.2</p>

<script src="version.js"></script>
<script>
    document.getElementById("site-version").textContent =
        "v" + window.AEPUNS_SITE_VERSION;
</script>
<script>
    // Additional Pages: add or reorder entries here; original five bubbles stay fixed.
    const additionalPages = [
        { label: "Stream Tools", href: "/stream/" }
    ];
    const tray = document.getElementById("additional-pages-tray");
    const trayToggle = document.getElementById("tray-toggle");
    const trayPanel = document.getElementById("tray-panel");
    additionalPages.forEach((page,index) => {
        if(index) { const separator=document.createElement("span"); separator.className="tray-separator"; separator.textContent="·"; separator.setAttribute("aria-hidden","true"); trayPanel.append(separator); }
        const link=document.createElement("a"); link.href=page.href; link.textContent=page.label; trayPanel.append(link);
    });
    trayToggle.addEventListener("click",() => {
        const open=!tray.classList.contains("is-open");
        tray.classList.toggle("is-open",open);
        trayToggle.setAttribute("aria-expanded",String(open));
        trayToggle.setAttribute("aria-label",open?"Close additional pages":"Open additional pages");
        trayPanel.inert=!open;
    });
    document.addEventListener("keydown",event => { if(event.key==="Escape"&&tray.classList.contains("is-open")){ trayToggle.click(); trayToggle.focus(); } });
</script>
<script src="js/script.js"></script>

</body>

</html>
